# Selenium Grid Configuration
# For local development
selenium.grid.url.local=http://localhost:4444/wd/hub

# For Docker environment (when running inside Docker container or with docker-compose)
selenium.grid.url.docker=http://selenium-hub:4444/wd/hub

# For CI/CD pipeline (Jenkins)
selenium.grid.url.ci=http://host.docker.internal:4444/wd/hub

# Active configuration (can be overridden via Maven property: -Dselenium.grid.env=docker)
selenium.grid.env=docker
